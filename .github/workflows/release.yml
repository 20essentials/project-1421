name: Release

on:
  workflow_dispatch:
    inputs:
      comment:
        description: "Release comment (optional)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "WIX_API_KEY secret not set; add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx @wix/cli login --api-key "$WIX_API_KEY"

      - name: Pull Wix env vars
        run: npx @wix/cli env pull

      - name: Wix build
        run: npm run build

      - name: Wix release
        env:
          COMMENT: ${{ inputs.comment }}
        run: |
          if [ -n "$COMMENT" ]; then
            npx @wix/cli release -c "$COMMENT"
          else
            npx @wix/cli release
          fi
