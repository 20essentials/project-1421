name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "WIX_API_KEY secret not set; add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx @wix/cli login --api-key "$WIX_API_KEY"

      - name: Pull Wix env vars
        run: npx @wix/cli env pull

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Chromium)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Build
        run: npm run build
